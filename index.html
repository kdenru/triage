<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div id="result" aria-live="polite">
    <p id="notice"></p>
    <div id="ready" hidden>
      <p>Тема: <strong id="topic"></strong></p>
      <p>Черновик ответа (проверьте перед отправкой):</p>
      <pre id="draft"></pre>
    </div>
  </div>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };
    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const notice = document.querySelector("#notice");
    const ready = document.querySelector("#ready");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    function show(message, data) {
      notice.textContent = message;
      topic.textContent = data ? TOPIC_LABELS[data.topic] : "";
      draft.textContent = data ? data.draft : "";
      ready.hidden = !data;
    }

    async function triage(text) {
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        return await reply.json();
      } catch {
        return { status: "manual_review" };
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      show("Разбираем заявку…", null); // drop the previous draft right away
      button.disabled = true;
      const data = await triage(document.querySelector("#message").value);
      button.disabled = false;
      if (data.status === "ready") show("", data);
      else if (data.status === "invalid_input") show("Введите текст заявки.", null);
      else show("AI не смог разобрать заявку. Разберите её вручную: определите тему и напишите ответ сами.", null);
    });
  </script>
</body>
</html>
